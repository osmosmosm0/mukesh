<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mukesh</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #111;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
    }
    img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      border-radius: 8px;
    }
    button {
      position: absolute;
      bottom: 10px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

  <audio id="mukeshAudio" src="mukesh.mp3" loop preload="auto"></audio>

  <img src="mukesh.png" alt="Mukesh">

  <script>
    const width = 250;
    const height = 250;
    const audio = document.getElementById('mukeshAudio');

    function playAudio() {
      audio.play().catch(err => console.log('Audio play blocked:', err));
    }

    function spawnChild() {
      const uniqueName = 'mukesh_' + Math.random().toString(36).substring(2, 9);

      const left = Math.floor(Math.random() * (screen.availWidth - width));
      const top = Math.floor(Math.random() * (screen.availHeight - height));

      window.open(
        'mukesh.html?autostart=true',
        uniqueName,
        `width=${width},height=${height},left=${left},top=${top},resizable=yes`
      );
    }

    let posX = window.screenX || window.screenLeft || 100;
    let posY = window.screenY || window.screenTop || 100;
    let dx = (Math.random() - 0.5) * 30;
    let dy = (Math.random() - 0.5) * 30;

    function moveWindow() {
      const maxW = screen.availWidth - window.outerWidth;
      const maxH = screen.availHeight - window.outerHeight;

      posX += dx;
      posY += dy;

      if (posX <= 0 || posX >= maxW) dx = -dx;
      if (posY <= 0 || posY >= maxH) dy = -dy;

      window.moveTo(posX, posY);

      requestAnimationFrame(moveWindow);
    }

    requestAnimationFrame(moveWindow);

    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.get('autostart') === 'true') {
      playAudio();
      setTimeout(spawnChild, 800);
    } else {
      const btn = document.createElement('button');
      btn.textContent = 'mesukh toes';
      btn.onclick = () => {
        playAudio();
        spawnChild();
        btn.remove();
      };
      document.body.appendChild(btn);
    }
  </script>
</body>
</html>
